services:
  - type: web
    name: lookatme-billing-api
    runtime: node
    buildCommand: npm install --legacy-peer-deps && npm rebuild sqlite3 --build-from-source
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://paurushartwani.github.io
